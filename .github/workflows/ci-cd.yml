name: Mindflow CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Check backend JavaScript syntax
        working-directory: server
        run: |
          node --check index.js
          node --check routes/auth.js
          node --check routes/journal.js
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install
      - name: Run frontend tests
        working-directory: server/frontend
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build

  docker:
    name: Build and Verify Docker Stack
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t mindflow-api ./server
      - name: Build web image
        run: docker build -t mindflow-web --build-arg REACT_APP_API_URL="" ./server/frontend
      - name: Verify Docker Compose startup
        env:
          JWT_SECRET: ci-cd-test-secret-key-at-least-32-chars-long
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps
          docker compose down
