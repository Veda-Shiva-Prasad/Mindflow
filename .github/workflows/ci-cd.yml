name: Mindflow CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Check backend JavaScript syntax
        working-directory: server
        run: |
          node --check index.js
          node --check routes/auth.js
          node --check routes/journal.js
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install
      - name: Run frontend tests
        working-directory: server/frontend
        run: npm test
        env:
          CI: true
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build

  docker:
    name: Build and Verify Docker Stack
    runs-on: ubuntu-latest
    needs: validate
    env:
      JWT_SECRET: ci-cd-test-secret-key-at-least-32-chars-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t mindflow-api ./server
      - name: Build web image
        run: docker build -t mindflow-web --build-arg REACT_APP_API_URL="" ./server/frontend
      - name: Start Docker Compose stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify the web app is served
        run: curl --fail --silent --show-error http://localhost:8081/ > /dev/null
      - name: Verify /auth is proxied to the API
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -X POST http://localhost:8081/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ci-user","password":"wrong-password"}')
          echo "POST /auth/login returned HTTP $status"
          test "$status" = "401"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
